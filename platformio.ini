; BlueCore BC-01
; Kart üzerindeki modül okunmadan bir hedef "doğru kart" sayılmaz.
; Ortamlar aynı uygulamayı derler. Hiçbiri sensör veya panel pini açmaz.
; BLUECORE_FIELD_MODE tanımlıysa açılış saha modundadır; aksi halde demo modudur.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@8.0.0
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Iinclude
build_src_filter =
    +<*>

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BLUECORE_TARGET_ESP32=1

[env:esp32dev-field]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BLUECORE_TARGET_ESP32=1
    -D BLUECORE_FIELD_MODE=1

; UART köprüsü varsayılanı. USB yazısı farklıysa esp32-s3-usb ortamı denenir.
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D BLUECORE_TARGET_ESP32S3=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Geliştirme kartının doğal USB-Serial/JTAG kapısı için.
[env:esp32-s3-usb]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D BLUECORE_TARGET_ESP32S3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-usb-field]
board = esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-usb.build_flags}
    -D BLUECORE_FIELD_MODE=1
